<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bambooGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bambooGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#047857" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Bamboo Stalk Left (Shorter) -->
    <rect x="140" y="180" width="34" height="260" rx="10" fill="url(#bambooGrad2)"/>
    <rect x="136" y="240" width="42" height="8" rx="4" fill="#D1FAE5"/>
    <rect x="136" y="320" width="42" height="8" rx="4" fill="#D1FAE5"/>
    <rect x="136" y="400" width="42" height="8" rx="4" fill="#D1FAE5"/>

    <!-- Bamboo Stalk Center (Taller) -->
    <rect x="236" y="100" width="40" height="340" rx="12" fill="url(#bambooGrad1)"/>
    <rect x="230" y="170" width="52" height="10" rx="5" fill="#ECFDF5"/>
    <rect x="230" y="260" width="52" height="10" rx="5" fill="#ECFDF5"/>
    <rect x="230" y="350" width="52" height="10" rx="5" fill="#ECFDF5"/>

    <!-- Bamboo Stalk Right (Medium) -->
    <rect x="338" y="140" width="34" height="300" rx="10" fill="url(#bambooGrad2)"/>
    <rect x="334" y="210" width="42" height="8" rx="4" fill="#D1FAE5"/>
    <rect x="334" y="290" width="42" height="8" rx="4" fill="#D1FAE5"/>
    <rect x="334" y="370" width="42" height="8" rx="4" fill="#D1FAE5"/>

    <!-- Bamboo Leaves Center Top -->
    <path d="M256 110 C210 70, 160 80, 140 100 C180 120, 230 120, 256 110 Z" fill="url(#leafGrad)"/>
    <path d="M256 110 C302 70, 352 80, 372 100 C332 120, 282 120, 256 110 Z" fill="url(#leafGrad)"/>
    <path d="M256 110 C240 40, 260 20, 280 10 C285 40, 275 80, 256 110 Z" fill="#34D399"/>

    <!-- Bamboo Leaves Left -->
    <path d="M157 190 C110 160, 70 170, 50 190 C90 200, 130 200, 157 190 Z" fill="url(#leafGrad)"/>
    <path d="M157 190 C130 130, 150 100, 170 85 C175 120, 170 160, 157 190 Z" fill="#6EE7B7"/>

    <!-- Bamboo Leaves Right -->
    <path d="M355 150 C400 120, 440 130, 460 150 C420 160, 380 160, 355 150 Z" fill="url(#leafGrad)"/>
    <path d="M355 150 C380 90, 360 60, 340 45 C335 80, 340 120, 355 150 Z" fill="#34D399"/>
  </g>
</svg>
