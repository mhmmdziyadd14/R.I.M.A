<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bambooGreenMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bambooGreenDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bambooLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="bambooDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#bambooDropGlow)">
    <!-- Bamboo Stalk 1 (Left) -->
    <rect x="135" y="170" width="36" height="270" rx="10" fill="url(#bambooGreenDark)"/>
    <rect x="130" y="235" width="46" height="8" rx="4" fill="#E6F4EA"/>
    <rect x="130" y="315" width="46" height="8" rx="4" fill="#E6F4EA"/>
    <rect x="130" y="395" width="46" height="8" rx="4" fill="#E6F4EA"/>

    <!-- Bamboo Stalk 2 (Center Tall) -->
    <rect x="234" y="90" width="44" height="350" rx="12" fill="url(#bambooGreenMain)"/>
    <rect x="227" y="165" width="58" height="10" rx="5" fill="#E6F4EA"/>
    <rect x="227" y="255" width="58" height="10" rx="5" fill="#E6F4EA"/>
    <rect x="227" y="345" width="58" height="10" rx="5" fill="#E6F4EA"/>

    <!-- Bamboo Stalk 3 (Right) -->
    <rect x="340" y="135" width="36" height="305" rx="10" fill="url(#bambooGreenDark)"/>
    <rect x="335" y="205" width="46" height="8" rx="4" fill="#E6F4EA"/>
    <rect x="335" y="285" width="46" height="8" rx="4" fill="#E6F4EA"/>
    <rect x="335" y="365" width="46" height="8" rx="4" fill="#E6F4EA"/>

    <!-- Top Bamboo Leaves (Center) -->
    <path d="M256 95 C205 50, 150 65, 130 85 C175 105, 230 105, 256 95 Z" fill="url(#bambooLeaf)"/>
    <path d="M256 95 C307 50, 362 65, 382 85 C337 105, 282 105, 256 95 Z" fill="url(#bambooLeaf)"/>
    <path d="M256 95 C238 25, 260 5, 282 -5 C287 25, 277 65, 256 95 Z" fill="#34D399"/>

    <!-- Left Bamboo Leaves -->
    <path d="M153 175 C100 145, 60 155, 40 175 C85 185, 125 185, 153 175 Z" fill="url(#bambooLeaf)"/>
    <path d="M153 175 C125 115, 145 85, 165 70 C170 105, 165 145, 153 175 Z" fill="#A7F3D0"/>

    <!-- Right Bamboo Leaves -->
    <path d="M358 140 C408 110, 448 120, 468 140 C423 150, 383 150, 358 140 Z" fill="url(#bambooLeaf)"/>
    <path d="M358 140 C383 80, 363 50, 343 35 C338 70, 343 110, 358 140 Z" fill="#34D399"/>
  </g>
</svg>
