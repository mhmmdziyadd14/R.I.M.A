<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="flagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#flagGlow)">
    <!-- Flag Pole Finial (Gold Ball) -->
    <circle cx="85" cy="50" r="16" fill="url(#poleGrad)"/>

    <!-- Flag Pole Stick -->
    <rect x="79" y="50" width="12" height="420" rx="6" fill="url(#poleGrad)"/>
    
    <!-- Flag Base Mount Ring -->
    <rect x="73" y="450" width="24" height="12" rx="4" fill="#B45309"/>

    <!-- Waving Flag Group -->
    <!-- Top Half: MERAH -->
    <path d="M91 66 C180 50, 270 90, 360 70 C410 60, 440 75, 470 70 L470 210 C440 215, 410 200, 360 210 C270 230, 180 190, 91 206 Z" fill="url(#redGrad)"/>

    <!-- Bottom Half: PUTIH -->
    <path d="M91 206 C180 190, 270 230, 360 210 C410 200, 440 215, 470 210 L470 350 C440 355, 410 340, 360 350 C270 370, 180 330, 91 346 Z" fill="url(#whiteGrad)"/>

    <!-- Flag Wave Shading / Highlights -->
    <path d="M91 66 C180 50, 270 90, 360 70 C410 60, 440 75, 470 70 L470 350 C440 355, 410 340, 360 350 C270 370, 180 330, 91 346 Z" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="4"/>

    <!-- Flag Attachment Rings -->
    <circle cx="85" cy="80" r="6" fill="#D97706"/>
    <circle cx="85" cy="330" r="6" fill="#D97706"/>
  </g>
</svg>
